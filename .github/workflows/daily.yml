# อัปเดตข้อมูลอากาศทุกวันเวลา 05:10 น. (เวลาไทย) แล้ว deploy ขึ้น GitHub Pages ฟรี
# วันจันทร์จะส่งสรุปเข้า LINE OA ด้วย ถ้าตั้ง secret LINE_CHANNEL_ACCESS_TOKEN ไว้
name: daily-weather
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch weather for 117 tambons
        run: node scripts/fetch-weather.mjs public/data/weather.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Weekly LINE broadcast (Monday, optional)
        if: github.event_name == 'schedule'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "$(TZ=Asia/Bangkok date +%u)" = "1" ]; then node scripts/line-broadcast.mjs public/data/weather.json; fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
